<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resend my access link | Worldwide Itineraries</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --atlantic:#0A5C66; --ochre:#F2B344; --basalt:#1F2427; --ink-soft:#4A5457; --mist:#EDF3F2; --line:#B9C6C5;
          --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"Figtree","Segoe UI",system-ui,sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; font-family:var(--body); font-size:1.0625rem;
         line-height:1.6; color:var(--basalt); background:#fff; -webkit-font-smoothing:antialiased; }
  .topbar { background:var(--atlantic); color:#fff; }
  .topbar .wrap { width:min(1120px, 100% - 32px); margin-inline:auto; padding:20px 0; }
  .brand { font-family:var(--display); font-weight:800; font-size:1.1rem; color:inherit; text-decoration:none; }
  main { flex:1; width:min(560px, 100% - 32px); margin-inline:auto; padding:clamp(40px, 8vw, 80px) 0; }
  h1 { font-family:var(--display); font-size:clamp(1.8rem, 5vw, 2.6rem); font-weight:800; line-height:1.1; letter-spacing:-0.02em; margin:0; }
  p { margin:16px 0 0; color:var(--ink-soft); }
  label { display:block; margin-top:28px; font-weight:600; color:var(--basalt); }
  input { width:100%; margin-top:8px; padding:12px 14px; font:inherit; border:1px solid var(--line); border-radius:10px; }
  button { margin-top:20px; background:var(--basalt); color:#fff; border:0; font:inherit; font-weight:600; padding:14px 28px; border-radius:999px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #status { min-height:1.6em; margin-top:18px; }
  #status.ok { color:var(--atlantic); }
  #status.err { color:#9B2C2C; }
  a { color:var(--atlantic); }
  :focus-visible { outline:3px solid var(--atlantic); outline-offset:3px; }
</style>
</head>
<body>
<header class="topbar"><div class="wrap"><a class="brand" href="index.html">Worldwide Itineraries</a></div></header>
<main>
  <h1>Resend my access link</h1>
  <p>Lost your email? Enter the email address you used at checkout and we will send you a new link, as long as your 30 days of access have not ended.</p>
  <form id="form" novalidate>
    <label for="email">Email used for your order</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <button type="submit" id="send">Send my link</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
  <p>Still stuck? <a href="index.html#contact">Send us a message</a>.</p>
</main>
<script>
  const form = document.getElementById('form');
  const status = document.getElementById('status');
  const send = document.getElementById('send');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    status.className = '';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      status.textContent = 'Please enter a valid email address.';
      status.classList.add('err');
      return;
    }
    send.disabled = true;
    status.textContent = 'Sending…';
    try {
      const res = await fetch('/api/resend-access', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      if (res.status === 429) throw new Error('limit');
      if (!res.ok) throw new Error('failed');
      status.textContent = 'If we find an active order for that email, a new link is on its way. Check your spam folder too.';
      status.classList.add('ok');
    } catch (err) {
      status.textContent = err.message === 'limit'
        ? 'Too many requests. Please try again in a while.'
        : 'Something went wrong. Please try again in a moment.';
      status.classList.add('err');
    } finally {
      send.disabled = false;
    }
  });
</script>
</body>
</html>
