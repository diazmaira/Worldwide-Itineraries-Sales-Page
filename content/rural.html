<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Rural Heart of Fuerteventura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Same font families as the Worldwide Itineraries website -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    /* palette */
    --cream: #FEF8EE;
    --cream-card: #FBF4E6;
    --choc: #3E2418;
    --terracotta: #C2613F;
    --caramel: #D9A15B;
    --sand: #EBCB9A;
    --border: rgba(62, 36, 24, .24);

    /* spacing + shape (all responsive) */
    --gap: clamp(5px, 1.7vw, 9px);
    --pad: clamp(6px, 2vw, 10px);
    --radius: clamp(10px, 3.4vw, 16px);
    --radius-img: clamp(7px, 2.4vw, 12px);
    --shadow: 0 1px 2px rgba(62, 36, 24, .08), 0 2px 6px rgba(62, 36, 24, .05);

    /* type */
    --display: "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
    --body: "DM Sans", system-ui, -apple-system, sans-serif;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--cream);
    color: var(--choc);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    -webkit-touch-callout: none;
  }

  /* Gesture surface (zoom + pan live here only) */
  #viewport {
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Zoomable stage: header + 3x3 grid, exactly the screen at zoom 1 */
  #stage {
    box-sizing: border-box;
    width: 100vw;
    height: 100dvh;
    padding: var(--pad);
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    transform-origin: 0 0;
  }

  /* ---------- Header (supplied illustration, full width) ---------- */
  .header {
    position: relative;
    flex: 0 0 auto;
    width: calc(100% + var(--pad) * 2);
    margin: calc(var(--pad) * -1) calc(var(--pad) * -1) 0;
    aspect-ratio: 724 / 352;
    background: var(--cream);
    overflow: hidden;
  }
  .header img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 0;
    -webkit-user-drag: none;
  }
  .header { container-type: inline-size; }
  .header .hd-eyebrow {
    position: absolute; left: 0; right: 0; top: 1.3cqw; margin: 0;
    display: flex; align-items: center; justify-content: center; gap: 3cqw;
    font-family: var(--display); font-weight: 700; font-size: 3.2cqw; line-height: 1;
    letter-spacing: .17em; text-transform: uppercase; color: #4A230E;
    padding-left: .17em;
  }
  .header .hd-eyebrow i { display: block; width: 9cqw; height: .35cqw; background: #4A230E; opacity: .85; }
  .header .hd-sub {
    position: absolute; left: 8.4cqw; top: 25.6cqw; width: 53cqw; margin: 0;
    font-family: var(--body); font-weight: 600; font-size: 2.85cqw; line-height: 1.3;
    color: #4A230E; text-wrap: pretty;
    text-shadow: 0 0 1.2cqw rgba(253, 246, 232, .95), 0 0 .4cqw rgba(253, 246, 232, .9);
  }
  .header h1 { /* title is part of the image; kept for screen readers */
    position: absolute;
    width: 1px; height: 1px;
    margin: 0; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* ---------- 3 x 3 grid ---------- */
  .grid {
    flex: 1 1 0;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: var(--gap);
  }

  /* ---------- Simple card (unchanged) ---------- */
  .card {
    box-sizing: border-box;
    min-width: 0;
    min-height: 0;
    container-type: size;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4cqw;
    padding: 5cqw 5cqw 6cqw;
    background: var(--cream-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .num {
    flex: 0 0 auto;
    width: clamp(1.05rem, 15cqw, 1.7rem);
    height: clamp(1.05rem, 15cqw, 1.7rem);
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--terracotta);
    color: var(--cream-card);
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(.62rem, 8.4cqw, .95rem);
    line-height: 1;
  }

  .media {
    flex: 1 1 0;
    min-height: 0;
    width: 100%;
    position: relative;
    overflow: hidden;
    border-radius: var(--radius-img);
    background: var(--sand);
  }
  .media img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .media.icon {
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--sand) 55%, var(--cream-card));
    border: 1px solid var(--border);
  }
  .media.icon svg {
    width: 64%;
    height: 64%;
    max-height: 100%;
    fill: none;
    stroke: var(--terracotta);
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .media.icon svg .brown { stroke: var(--choc); }
  .media.icon svg .accent { stroke: var(--caramel); }

  .card > h2 {
    flex: 0 0 auto;
    margin: 0;
    width: 100%;
    text-align: center;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(.56rem, 8.4cqw, 1rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--choc);
    text-wrap: balance;
    overflow-wrap: break-word;
  }

  /* =====================================================================
     STOP CARD (reusable). One scope class (.st-scope) is shared by the
     miniature in the grid and by the full-screen sheet.
     Front: sized in cqw so it scales with its container.
     Back: normal mobile typography (px / rem / vw), full-screen only.
     Per-stop colors come from --st-* variables set inline.
     ===================================================================== */
  .st-scope {
    --st-brown: #6B3716;
    --st-brown-dark: #4A230E;
    --st-accent: #C77B2A;
    --st-muted: #7B5B47;
    --st-line: rgba(107, 55, 22, .24);
    --st-r: 9cqw;
    container-type: size;
  }

  .card.stop {
    display: block;
    position: relative;
    padding: 0;
    gap: 0;
    background: transparent;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }

  .st-scope .face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: var(--st-r);
    border: 1px solid var(--st-line);
    background: linear-gradient(180deg, #FCF6EA 0%, #F8EDD9 100%);
    box-shadow: 0 0 0 .9cqw #FFFCF6 inset, 0 .6cqw 2.4cqw rgba(74, 35, 14, .14);
    color: var(--st-brown-dark);
  }
  .st-scope .front { cursor: pointer; }

  /* brown number badge (size set per face) */
  .st-scope .badge {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--st-brown);
    color: #FFF6E6;
    font-family: var(--display);
    font-weight: 800;
    line-height: 1;
    box-shadow: 0 .5cqw 1.2cqw rgba(74, 35, 14, .28);
  }
  .st-scope .title {
    margin: 0;
    padding: 0;
    font-family: var(--display);
    font-weight: 800;
    font-style: italic;
    letter-spacing: -0.02em;
    color: var(--st-brown-dark);
  }

  /* ---------- FRONT (miniature in the grid, and the start of the expand) ---------- */
  .front .wave-top,
  .front .waves-bottom {
    position: absolute;
    left: 3cqw;
    right: 3cqw;
    overflow: hidden;
    pointer-events: none;
  }
  .front .wave-top    { top: 3cqw;    height: 7cqw;  border-radius: 6cqw 6cqw 0 0; }
  .front .waves-bottom{ bottom: 3cqw; height: 11cqw; border-radius: 0 0 6cqw 6cqw; }
  .front .wave-top svg,
  .front .waves-bottom svg { display: block; width: 100%; height: 100%; }

  .front .front-body {
    position: absolute;
    top: 10.6cqw;
    right: 2.4cqw;
    bottom: 14.6cqw;
    left: 2.4cqw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 0;
  }
  .front .front-head {
    flex: 0 0 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .front .titlerow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2cqw;
    max-width: 100%;
  }
  .front .badge { width: 12.5cqw; font-size: 7cqw; }
  .front .title {
    font-size: var(--title-size, 14cqw);
    line-height: 1;
    white-space: nowrap;
  }
  .front .underline {
    display: block;
    width: 54cqw;
    height: auto;
    margin-top: .2cqw;
    fill: #E8923A;
  }
  .front .tagline {
    margin: .8cqw 0 0;
    max-width: 92cqw;
    text-align: center;
    font-family: var(--body);
    font-style: italic;
    font-weight: 500;
    font-size: 4.8cqw;
    line-height: 1.15;
    color: var(--st-brown-dark);
    text-wrap: balance;
  }
  .front .photo {
    flex: 0 1 50cqh;
    min-height: 0;
    width: 100%;
    position: relative;
    overflow: hidden;
    border-radius: 4.5cqw;
    background: var(--sand);
  }
  .st-scope .photo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: var(--photo-pos, 50% 50%);
    display: block;
    -webkit-user-drag: none;
  }
  .front .icons {
    flex: 0 0 auto;
    list-style: none;
    margin: 0;
    padding: 0;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr));
    align-items: start;
  }
  .front .icons li {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .5cqw;
    padding: 0 .4cqw;
    text-align: center;
    color: var(--ic, var(--st-brown));
  }
  .front .icons li + li { border-left: 1px solid var(--st-line); }
  .front .icons svg {
    width: 8.4cqw;
    height: 8.4cqw;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    overflow: visible;
  }
  .st-scope svg .f { fill: currentColor; fill-opacity: .2; }
  .st-scope svg .d { fill: currentColor; stroke: none; }
  .front .icons span {
    font-family: var(--body);
    font-weight: 700;
    font-size: 3.5cqw;
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--st-brown-dark);
  }

  /* ---------- FULL-SCREEN OVERLAY (outside the zoomable stage) ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    height: 100dvh;
    z-index: 1000;
    overflow: hidden;
    touch-action: pan-y;
    overscroll-behavior: none;
  }
  .overlay .backdrop {
    position: absolute;
    inset: 0;
    background: rgba(62, 36, 24, .42);
  }
  .sheet {
    position: absolute;
    inset: 0;
    perspective: 1700px;
    transform-origin: 50% 50%;
  }
  .sheet .flip {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    border-radius: inherit;
  }
  .sheet .flip.is-flipped { transform: rotateY(180deg); }
  .sheet .face { border-radius: inherit; }
  .sheet .front { pointer-events: none; cursor: default; }
  .sheet .back {
    transform: rotateY(180deg);
    border: 0;
    box-shadow: none;
  }
  /* after the flip: flat, no 3D, so native scrolling is rock solid */
  .sheet.settled { perspective: none; }
  .sheet.settled .flip { transform: none; transform-style: flat; }
  .sheet.settled .front { display: none; }
  .sheet.settled .back { transform: none; }

  /* ---------- BACK (full-screen mobile page) ---------- */
  .back {
    --wave-top-h: clamp(24px, 7vw, 38px);
    --wave-bot-h: clamp(46px, 12.5vw, 72px);
    --green: #4F8A3C;
    display: flex;
    flex-direction: column;
    font-family: var(--body);
    font-size: 16px;
    color: var(--st-brown-dark);
  }
  .back button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
  .back .bk-wave-top {
    position: absolute; top: 0; left: 0; right: 0;
    height: var(--wave-top-h);
    pointer-events: none;
  }
  .back .bk-waves-bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: calc(var(--wave-bot-h) + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  .back .bk-wave-top svg,
  .back .bk-waves-bottom svg { display: block; width: 100%; height: 100%; }

  .back .bk-head {
    position: relative;
    z-index: 2;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: calc(env(safe-area-inset-top) + var(--wave-top-h) + 6px) 16px 8px 18px;
  }
  .back .badge { width: 46px; font-size: 1.5rem; box-shadow: 0 2px 5px rgba(74, 35, 14, .28); }
  .back .bk-titlewrap { position: relative; flex: 1 1 auto; min-width: 0; padding-bottom: 12px; }
  .back .title {
    font-size: clamp(2rem, 10.5vw, 2.9rem);
    line-height: 1.04;
    white-space: nowrap;
  }
  .back .bk-underline {
    position: absolute; left: 2px; bottom: 0;
    width: min(88%, 250px); height: 10px;
    fill: #E8923A;
  }
  .back .bk-close {
    flex: 0 0 auto;
    display: grid; place-items: center;
    width: 46px; height: 46px; padding: 0;
    border: 1px solid var(--st-line);
    border-radius: 50%;
    background: rgba(255, 255, 255, .75);
    color: var(--st-brown);
    cursor: pointer;
  }
  .back .bk-close svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }

  .back .bk-closewrap { position: relative; flex: 0 0 auto; width: 46px; height: 46px; }
  .back .bk-visited-mark {
    display: none;
    position: absolute; top: -9px; right: -9px;
    place-items: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--green);
    border: 2px solid #FFFCF6;
    box-shadow: 0 1px 3px rgba(74, 35, 14, .35);
    pointer-events: none;
  }
  .back .bk-visited-mark svg { width: 70%; height: 70%; fill: none; stroke: #fff; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .st-scope.is-visited .back .bk-visited-mark { display: grid; }

  .back .bk-scroll {
    position: relative;
    z-index: 1;
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 8px 16px 28px;
  }
  .back .bk-scroll > * { flex: 0 0 auto; }

  .back .bk-photo {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    overflow: hidden;
    background: var(--sand);
    box-shadow: 0 2px 10px rgba(74, 35, 14, .2);
  }

  /* ----- audio guide ----- */
  .back .audio {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    gap: 14px;
    padding: 12px 16px 12px 12px;
    border: 1px solid var(--st-line);
    border-radius: 20px;
    background: rgba(246, 232, 207, .75);
    box-shadow: 0 1px 4px rgba(74, 35, 14, .1);
  }
  .back .audio .play {
    display: grid; place-items: center;
    width: 54px; height: 54px; padding: 0;
    border: 0; border-radius: 50%;
    background: var(--st-brown);
    color: #FFF6E6;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(74, 35, 14, .3);
  }
  .back .audio .play:disabled { opacity: .4; cursor: default; box-shadow: none; }
  .back .audio .play svg { width: 22px; height: 22px; fill: currentColor; }
  .back .audio .i-pause { display: none; }
  .back .audio.is-playing .i-play { display: none; }
  .back .audio.is-playing .i-pause { display: block; }
  .back .audio .a-top { display: flex; align-items: center; gap: 10px; }
  .back .audio .a-text { flex: 1 1 auto; min-width: 0; }
  .back .audio .a-title { display: block; font-size: 1.05rem; font-weight: 700; line-height: 1.2; }
  .back .audio .a-sub { display: block; font-size: .88rem; font-style: italic; color: var(--st-muted); line-height: 1.25; }
  .back .audio .a-time { flex: 0 0 auto; font-size: .85rem; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--st-brown-dark); }
  .back .audio .a-time[hidden] { display: none; }
  .back .audio .a-mute {
    flex: 0 0 auto; display: grid; place-items: center;
    width: 36px; height: 36px; padding: 0;
    border: 0; background: transparent; color: var(--st-brown); cursor: pointer;
  }
  .back .audio .a-mute:disabled { opacity: .35; cursor: default; }
  .back .audio .a-mute svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .back .audio .a-mute .i-off { display: none; }
  .back .audio.is-muted .i-on { display: none; }
  .back .audio.is-muted .i-off { display: block; }
  .back .a-range {
    -webkit-appearance: none; appearance: none;
    display: block; width: 100%; height: 22px; margin: 2px 0 0; padding: 0;
    background: transparent; cursor: pointer; touch-action: pan-y;
    --p: 0%;
  }
  .back .a-range:disabled { cursor: default; }
  .back .a-range::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right, var(--st-brown) var(--p), rgba(107, 55, 22, .22) var(--p));
  }
  .back .a-range::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(107, 55, 22, .22); }
  .back .a-range::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--st-brown); }
  .back .a-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; margin-top: -6px; border: 0; border-radius: 50%;
    background: var(--st-brown); box-shadow: 0 1px 3px rgba(74, 35, 14, .4);
  }
  .back .a-range::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: var(--st-brown); }
  .back .a-range:disabled::-webkit-slider-thumb { opacity: .55; }

  /* ----- intro ----- */
  .back .bk-intro {
    margin: 0;
    padding-left: 14px;
    border-left: 3px solid #E8B63A;
    font-size: 1.02rem;
    line-height: 1.5;
  }

  .back .bk-intro p { margin: 0; }
  .back .bk-intro p + p { margin-top: 12px; }
  .back .bk-meta { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .back .bk-sub { font-size: 1.1rem; font-style: italic; line-height: 1.3; }
  .back .act-titles { display: grid; gap: 2px; min-width: 0; }
  .back .act-sub { font-size: .92rem; font-weight: 500; line-height: 1.25; color: var(--st-muted); }
  .back .act-sub[hidden] { display: none; }
  .back .chip { padding-top: 6px; padding-bottom: 6px; border-radius: 18px; line-height: 1.3; max-width: 100%; }
  .back .chip svg { flex: 0 0 auto; }
  .back .act-note {
    display: flex; align-items: flex-start; gap: 10px;
    margin: 0; padding: 11px 13px;
    border-radius: 14px;
    background: rgba(232, 182, 58, .17);
    font-size: .95rem; line-height: 1.4;
  }
  .back .act-note svg { flex: 0 0 auto; width: 20px; height: 20px; margin-top: 1px; fill: none; stroke: #B8861B; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .st-scope.long-title .front .title { white-space: normal; text-align: left; line-height: 1.02; min-width: 0; }
  .st-scope.long-title .back .title { white-space: normal; font-size: clamp(1.5rem, 7.6vw, 2.1rem); line-height: 1.06; overflow-wrap: anywhere; }

  /* ---------- WELCOME CARD (card 1) ---------- */
  .welcome-front { font-family: var(--body); }
  .welcome-front .wf-body {
    position: absolute; top: 10.6cqw; bottom: 14.6cqw; left: 5cqw; right: 5cqw;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    text-align: center; min-height: 0;
  }
  .welcome-front .wf-main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.2cqw; }
  .welcome-front .wf-compass {
    width: 31cqw; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;

  .back .collage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; -webkit-user-drag: none; }
  .back .act-fine { margin: -4px 0 0; font-size: .88rem; line-height: 1.4; color: var(--st-muted); }

  /* ---------- FIRST THREE CARDS, FRONT: icon + big title (+ one info line) ---------- */

  /* two-photo collage: same box as the single photo (.ph, 16:9), halves with no gap */

  .back .ph.ph-duo .cell { position: relative; min-width: 0; overflow: hidden; }

  .back .collage.gap-white { gap: 5px; background: #fff; }

  .back .bk-tag {
    margin: 3px 0 0; font-family: var(--body); font-size: 12.5px; font-style: italic; font-weight: 400;

  /* ----- section heading ----- */
  .back .sec-h {

    text-transform: uppercase;

  /* ----- accordions (activities + where to eat) ----- */
  .back .acts { display: grid; gap: 10px; }
  .back .act {
    --ac: var(--st-accent);
    border: 1px solid var(--st-line);

    box-shadow: 0 1px 4px rgba(74, 35, 14, .08);

  .back .act-h { margin: 0; }
  .back .act-head,
  .back .eat-head {
    display: grid;
    align-items: center;
    width: 100%;
    min-height: 58px;
    padding: 8px 14px 8px 10px;
    border: 0;
    background: transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .back .act-head { grid-template-columns: 44px minmax(0, 1fr) 24px; gap: 14px; }
  .back .act-icon {
    display: grid; place-items: center;
    width: 44px; height: 44px;
    border-radius: 13px;

  .back .act-title { font-family: var(--display); font-weight: 700; font-size: 1.12rem; line-height: 1.2; }
  .back .chev { width: 24px; height: 24px; fill: none; stroke: var(--st-brown); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s ease; }
  .back .open > .act-h .chev,
  .back .open > .eat-head .chev { transform: rotate(180deg); }

  .back .panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s ease; }
  .back .open > .panel { grid-template-rows: 1fr; }
  .back .panel > .inner { min-height: 0; overflow: hidden; }
  .back .act-body { display: grid; gap: 12px; padding: 2px 14px 16px; }

  .back .ph {
    position: relative;

    border-radius: 14px;

  /* where to eat */
  .back .eat {

  .back .places { list-style: none; margin: 0; padding: 0 16px 8px; }

  .back .places .ph svg { width: 26px; height: 26px; }
  .back .place-name { display: block; font-family: var(--display); font-weight: 700; font-size: 1.08rem; }
  .back .place-desc { margin: 3px 0 0; font-size: .95rem; line-height: 1.4; color: var(--st-muted); }
  .back .place-link { display: inline-block; margin-top: 6px; font-size: .92rem; font-weight: 600; color: var(--st-brown-dark); text-underline-offset: 3px; }

  /* mark as visited */
  .back .visit-btn {
    align-self: center;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 50px; padding: 0 28px;
    border: 1.5px solid var(--green);
    border-radius: 999px;
    background: rgba(255, 255, 255, .6);
    color: #2F5A22;
    font-weight: 700; font-size: 1.02rem;

  }
  .back .visit-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--green); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .back .visit-btn[aria-pressed="true"] { background: var(--green); color: #fff; }
  .back .visit-btn[aria-pressed="true"] svg { stroke: #fff; }

  /* fixed navigate button, above the sand waves */
  .back .bk-foot {
    position: relative;
    z-index: 2;
    flex: 0 0 auto;
    padding: 10px 22px calc(var(--wave-bot-h) + env(safe-area-inset-bottom) + 6px);
  }
  .back .nav-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 56px;
    border-radius: 999px;
    background: var(--st-brown);
    color: #FFF6E6;

  }
  .back .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }

  /* visited mark on the miniature (and on the sheet's front while it expands) */
  .front .visited-mark {
    display: none;
    position: absolute;
    top: .4cqw; right: .4cqw;
    z-index: 3;
    place-items: center;
    width: 10cqw; aspect-ratio: 1;
    border-radius: 50%;
    background: #4F8A3C;
    border: .7cqw solid #FFFCF6;
    box-shadow: 0 .4cqw 1cqw rgba(74, 35, 14, .3);

  .front .visited-mark svg { width: 62%; height: 62%; fill: none; stroke: #fff; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .st-scope.is-visited .front .visited-mark { display: grid; }

  @media (prefers-reduced-motion: reduce) {
    .back .panel, .back .chev { transition: none; }
  }
</style>

  proj = function (p) { return [((p[0] - minLon) * kx + pad) * UPK, ((maxLat - p[1]) * ky + pad) * UPK]; };
  vbW = ((maxLon - minLon) * kx + pad * 2) * UPK; vbH = ((maxLat - minLat) * ky + pad * 2) * UPK;
  svg.setAttribute('viewBox', '0 0 ' + vbW.toFixed(1) + ' ' + vbH.toFixed(1));
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  function path(ring, close) {
    return ring.map(function (p, i) { var q = proj(p); return (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join('') + (close ? 'Z' : '');
  }
  var g = el('g', {}, svg);
  D.coast.forEach(function (r) { el('path', { 'class': 'land', d: path(r, true) }, g); });
  D.route.forEach(function (r) { el('path', { 'class': 'route-case', d: path(r, false) }, g); });
  D.route.forEach(function (r) { el('path', { 'class': 'route', d: path(r, false) }, g); });
  ROUTE_STOPS.forEach(function (s) {
    var ll = D.stops[s.n]; if (!ll) return;
    var q = proj(ll);
    var m = el('g', { 'class': 'mk', tabindex: '0', role: 'button', 'data-n': s.n, 'aria-label': 'Stop ' + s.n + ', ' + s.name }, g);
    el('circle', { r: 26, fill: 'transparent' }, m);                 /* large tap target */
    el('circle', { 'class': 'dot', r: 15 }, m);
    var tx = el('text', {}, m); tx.textContent = s.n;
    mks.push({ el: m, x: q[0], y: q[1], s: s });
  });

  function ppu() { var r = svg.getBoundingClientRect(); return Math.min(r.width / vbW, r.height / vbH) || 1; }
  function render() {
    g.setAttribute('transform', 'translate(' + st.tx.toFixed(2) + ' ' + st.ty.toFixed(2) + ') scale(' + st.k.toFixed(4) + ')');
    var inv = 1 / (st.k * ppu());
    mks.forEach(function (m) { m.el.setAttribute('transform', 'translate(' + m.x.toFixed(1) + ' ' + m.y.toFixed(1) + ') scale(' + inv.toFixed(5) + ')'); });
    /* real scale bar */
    var pxKm = ppu() * st.k * UPK, nice = [1, 2, 5, 10, 20, 50], km = nice[0];
    nice.forEach(function (v) { if (v * pxKm <= 110) km = v; });
    scaleEl.querySelector('i').style.width = (km * pxKm).toFixed(0) + 'px';
    scaleEl.querySelector('span').textContent = km + ' km';
    placePop();
  }
  function clamp() {
    st.k = Math.max(1, Math.min(8, st.k));
    st.tx = Math.min(0, Math.max(vbW * (1 - st.k), st.tx));
    st.ty = Math.min(0, Math.max(vbH * (1 - st.k), st.ty));
  }
  function toVB(cx, cy) {
    var r = svg.getBoundingClientRect(), p = ppu();
    return [(cx - r.left - (r.width - vbW * p) / 2) / p, (cy - r.top - (r.height - vbH * p) / 2) / p];
  }
  function zoomAt(cx, cy, f) {
    var u = toVB(cx, cy), k2 = Math.max(1, Math.min(8, st.k * f)), loc = [(u[0] - st.tx) / st.k, (u[1] - st.ty) / st.k];
    st.tx = u[0] - loc[0] * k2; st.ty = u[1] - loc[1] * k2; st.k = k2; clamp(); render();
  }

  /* popup */
  function placePop() {
    if (!active || pop.hidden) return;
    var b = box.getBoundingClientRect(), r = active.el.getBoundingClientRect();
    var cx = r.left + r.width / 2 - b.left, top = r.top - b.top, w = pop.offsetWidth, h = pop.offsetHeight;
    var x = Math.max(8, Math.min(b.width - w - 8, cx - w / 2));
    var y = top - h - 8; if (y < 8) y = r.bottom - b.top + 8;
    pop.style.left = x.toFixed(0) + 'px'; pop.style.top = y.toFixed(0) + 'px';
  }
  function select(m) {
    mks.forEach(function (x) { x.el.classList.toggle('on', x === m); });
    active = m;
    if (!m) { pop.hidden = true; return; }
    pop.innerHTML = '<b>' + ('0' + m.s.n).slice(-2) + ' · ' + m.s.name + '</b><span>' + m.s.tags + '</span>';
    pop.hidden = false; placePop();
  }

  /* gestures: one pointer pans, two pointers pinch; a short still touch is a tap */
  var ptrs = {}, downT = null, moved = 0, last = null;
  svg.addEventListener('pointerdown', function (e) {
    svg.setPointerCapture(e.pointerId);
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (Object.keys(ptrs).length === 1) { moved = 0; downT = e.target.closest ? e.target.closest('.mk') : null; }
    else { moved = 99; }
    last = null;
  });
  svg.addEventListener('pointermove', function (e) {
    var p = ptrs[e.pointerId]; if (!p) return;
    var ids = Object.keys(ptrs);
    if (ids.length === 2) {
      var a = ptrs[ids[0]], b = ptrs[ids[1]];
      var o = { x: p.x, y: p.y }; p.x = e.clientX; p.y = e.clientY;
      var d1 = Math.hypot(a.x - b.x, a.y - b.y), d0;
      var oa = (ids[0] == e.pointerId) ? o : a, ob = (ids[1] == e.pointerId) ? o : b;
      d0 = Math.hypot(oa.x - ob.x, oa.y - ob.y);
      if (d0 > 0) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d1 / d0);
      return;
    }
    var dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 8) { var q = ppu(); st.tx += dx / q; st.ty += dy / q; clamp(); render(); }
  });
  function end(e) {
    var had = ptrs[e.pointerId]; delete ptrs[e.pointerId];
    if (!had || Object.keys(ptrs).length) return;
    if (moved <= 8) {
      var m = null;
      if (downT) mks.forEach(function (x) { if (x.el === downT) m = x; });
      select(m && m !== active ? m : (m ? m : null));
    }
    downT = null;
  }
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', function (e) { delete ptrs[e.pointerId]; downT = null; });
  svg.addEventListener('wheel', function (e) { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.25 : 0.8); }, { passive: false });
  box.querySelector('[data-zin]').addEventListener('click', function () { var r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.5); });
  box.querySelector('[data-zout]').addEventListener('click', function () { var r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.5); });
  mks.forEach(function (m) {
    m.el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(m); } });
  });
  window.addEventListener('resize', render);
  if (window.ResizeObserver) new ResizeObserver(render).observe(box);
  render();
}

/* ---- build helpers ---- */
function tplId(cfg, side) { return (cfg.kind || 'stop') + '-' + side + '-template'; }
function applyScope(el, cfg) {
  el.style.setProperty('--st-brown', cfg.colors.brown);
  el.style.setProperty('--st-brown-dark', cfg.colors.brownDark);
  el.style.setProperty('--st-accent', cfg.colors.accent);
  el.style.setProperty('--title-size', cfg.titleSize);
  el.style.setProperty('--photo-pos', cfg.photoPosition);
  el.classList.toggle('long-title', !!cfg.longTitle);
}

function placeholder(src, alt) {
  var d = document.createElement('div');
  d.className = 'ph';
  if (src) {
    var i = document.createElement('img');
    i.src = src; i.alt = alt || ''; i.draggable = false;
    d.appendChild(i);
  } else {
    d.innerHTML = UI.img + '<span>Add photo</span>';
  }
  return d;
}

function chip(iconKey, text, href) {
  var c = document.createElement(href ? 'a' : 'span');
  c.className = 'chip';
  if (href) { c.href = href; c.target = '_blank'; c.rel = 'noopener'; }
  c.innerHTML = UI[iconKey];
  c.appendChild(document.createTextNode(text));
  return c;
}

function buildDuo(items) {
  var d = document.createElement('div');
  d.className = 'ph ph-duo';
  items.forEach(function (it) {
    var f = document.createElement('div'); f.className = 'cell';
    var im = document.createElement('img');
    im.src = it.src; im.alt = it.alt || ''; im.draggable = false;
    if (it.pos) im.style.objectPosition = it.pos;
    f.appendChild(im); d.appendChild(f);
  });
  return d;
}

function buildCollage(items, cls) {
  var d = document.createElement('div');
  d.className = 'collage' + (cls ? ' ' + cls : '');
  items.forEach(function (it, i) {
    var f = document.createElement('div');
    f.className = 'cell c' + (i + 1);
    var im = document.createElement('img');
    im.src = it.src; im.alt = it.alt || ''; im.draggable = false; im.loading = 'lazy';
    f.appendChild(im);
    d.appendChild(f);
  });
  return d;
}

function buildActivity(a, open) {
  var art = document.createElement('article');
  art.className = 'act' + (open ? ' open' : '');
  art.style.setProperty('--ac', a.color);
  var pid = 'act-' + a.id;
  art.innerHTML =
    '<h4 class="act-h"><button type="button" class="act-head" aria-expanded="' + (open ? 'true' : 'false') + '" aria-controls="' + pid + '">' +
    '<span class="act-icon">' + ICONS[a.icon]() + '</span><span class="act-titles"><span class="act-title"></span><span class="act-sub" hidden></span></span>' + UI.chev + '</button></h4>' +
    '<div class="panel" id="' + pid + '"' + (open ? '' : ' inert') + '><div class="inner"><div class="act-body"></div></div></div>';
  art.querySelector('.act-title').textContent = a.title;
  if (a.subtitle) { var st = art.querySelector('.act-sub'); st.textContent = a.subtitle; st.hidden = false; }
  var body = art.querySelector('.act-body');
  if (!a.noImage) {
    var phEl = a.duo ? buildDuo(a.duo) : a.collage ? buildCollage(a.collage, a.collageClass) : placeholder(a.image, a.imageAlt);
    if (a.imagePos) { var pim = phEl.querySelector('img'); if (pim) pim.style.objectPosition = a.imagePos; }
    body.appendChild(phEl);
  }
  var p = document.createElement('p');
  p.className = 'act-desc';
  if (a.description) { p.textContent = a.description; }
  else { p.textContent = 'Description coming soon.'; p.classList.add('is-empty'); }
  body.appendChild(p);
  var facts = (a.facts || []);
  var links = (a.links || []);
  if (a.duration || a.price || facts.length || (a.mapsUrl && !a.mapsLabel) || links.length) {
    var row = document.createElement('div');
    row.className = 'chips';
    if (a.duration) row.appendChild(chip('clock', a.duration));
    if (a.price) row.appendChild(chip('coin', a.price));
    facts.forEach(function (f) { row.appendChild(chip(f.icon, f.text)); });
    if (a.mapsUrl && !a.mapsLabel) row.appendChild(chip('map', 'Open in Maps', a.mapsUrl));
    links.forEach(function (l) { row.appendChild(chip('map', l.label, l.url)); });
    if (row.childNodes.length) body.appendChild(row);
  }
  var notes = (a.notes || []).slice();
  if (a.note) notes.unshift(a.note);
  notes.forEach(function (txt) {
    var n = document.createElement('p');
    n.className = 'act-note';
    n.innerHTML = UI.info;
    n.appendChild(document.createTextNode(txt));
    body.appendChild(n);
  });
  if (a.fine) { var fp = document.createElement('p'); fp.className = 'act-fine'; fp.textContent = a.fine; body.appendChild(fp); }
  if (a.mapsUrl && a.mapsLabel) {
    var lr = document.createElement('div'); lr.className = 'chips';
    lr.appendChild(chip('map', a.mapsLabel, a.mapsUrl));
    body.appendChild(lr);
  }
  return art;
}

function buildPlace(pl) {
  var li = document.createElement('li');
  li.appendChild(placeholder(pl.image, pl.name));
  var box = document.createElement('div');
  var n = document.createElement('b'); n.className = 'place-name'; n.textContent = pl.name;
  box.appendChild(n);
  if (pl.description) { var d = document.createElement('p'); d.className = 'place-desc'; d.textContent = pl.description; box.appendChild(d); }
  if (pl.mapsUrl) { var a = document.createElement('a'); a.className = 'place-link'; a.href = pl.mapsUrl; a.target = '_blank'; a.rel = 'noopener'; a.textContent = pl.mapsLabel || 'Open in Maps'; box.appendChild(a); }
  li.appendChild(box);
  return li;
}

function fillBack(frag, cfg) {
  var b = cfg.back;
  var q = function (s) { return frag.querySelector(s); };
  var introBox = q('[data-slot="intro"]');
  (Array.isArray(b.intro) ? b.intro : [b.intro]).forEach(function (txt) {
    var p = document.createElement('p'); p.textContent = txt; introBox.appendChild(p);
  });
  if (b.info) {
    var infoRow = document.createElement('div'); infoRow.className = 'chips bk-info';
    b.info.facts.forEach(function (f) { infoRow.appendChild(chip(f.icon, f.text)); });
    if (b.info.mapsUrl) infoRow.appendChild(chip('map', 'Open in Maps', b.info.mapsUrl));
    introBox.insertAdjacentElement('afterend', infoRow);
  }
  var tg = q('[data-slot="tagline"]'); if (tg) { if (b.subtitle) tg.textContent = b.subtitle; else tg.remove(); }
  var meta = q('[data-slot="meta"]');
  if (b.subtitle || b.visit) {
    var sub = q('[data-slot="subtitle"]'), vis = q('[data-slot="visit"]');
    sub.remove();
    if (b.visit) { vis.innerHTML = UI.clock; vis.appendChild(document.createTextNode(b.visit)); } else vis.remove();
  } else { meta.remove(); }
  q('[data-slot="audio-sub"]').textContent = cfg.title + ' · Coming soon';
  var acts = q('[data-slot="activities"]');
  b.activities.forEach(function (a, i) { acts.appendChild(buildActivity(a, !!b.firstOpen && i === 0)); });   // firstOpen: per-stop setting
  if (b.eat) {
    q('[data-slot="eat-title"]').textContent = b.eat.title;
    q('[data-slot="eat-count"]').textContent = '· ' + b.eat.places.length + ' places';
    var ul = q('[data-slot="places"]');
    b.eat.places.forEach(function (pl) { ul.appendChild(buildPlace(pl)); });
  } else {
    q('[data-eat]').remove();          // stops without restaurants: no section, no spacing
  }
  var nav = q('[data-slot="navigate"]');
  if (b.navigateUrl) { nav.href = b.navigateUrl; nav.setAttribute('aria-label', 'Navigate to ' + cfg.title); }
  else { nav.removeAttribute('href'); nav.setAttribute('aria-disabled', 'true'); }
}

function fragment(templateId, cfg) {
  var frag = document.getElementById(templateId).content.cloneNode(true);
  var set = function (slot, fn) { frag.querySelectorAll('[data-slot="' + slot + '"]').forEach(fn); };

  set('number', function (n) { n.textContent = cfg.number; });
  set('title', function (n) { n.textContent = cfg.title; });
  set('tagline', function (n) { n.textContent = cfg.tagline; });
  set('photo', function (n) { n.src = cfg.photo; n.alt = cfg.photoAlt; });
  set('photo-back', function (n) { n.src = cfg.photo; n.alt = cfg.photoAlt; });

  set('icons', function (ul) {
    ul.style.setProperty('--n', cfg.icons.length);
    cfg.icons.forEach(function (ic) {
      var li = document.createElement('li');
      li.style.setProperty('--ic', ic.color);
      li.innerHTML = ICONS[ic.type]();
      var span = document.createElement('span');
      span.textContent = ic.label;
      li.appendChild(span);
      ul.appendChild(li);
    });
  });

  if (templateId === 'stop-back-template') fillBack(frag, cfg);
  return frag;
}

/* ---- visited state (persisted when the browser allows it) ---- */
var VISITED_KEY = 'wi:rural:visited';
var VISITED = {};
try { VISITED = JSON.parse(localStorage.getItem(VISITED_KEY) || '{}') || {}; } catch (e) { VISITED = {}; }

function applyVisited(scope, key) {
  var v = !!VISITED[key];
  scope.classList.toggle('is-visited', v);
  var btn = scope.querySelector('[data-visit]');
  if (btn) {
    btn.setAttribute('aria-pressed', v ? 'true' : 'false');
    btn.querySelector('span').textContent = v ? 'Visited' : 'Mark as visited';
  }
}
function setVisited(key, v) {
  VISITED[key] = !!v;
  try { localStorage.setItem(VISITED_KEY, JSON.stringify(VISITED)); } catch (e) { /* storage not available: keep it for this session only */ }
  document.querySelectorAll('.stop[data-stop="' + key + '"]').forEach(function (n) { applyVisited(n, key); });
  if (ctx && ctx.key === key) applyVisited(ctx.sheet, key);
}

/* ---- accordions ---- */
function setAcc(box, open) {
  box.classList.toggle('open', open);
  var head = box.querySelector('.act-head, .eat-head');
  if (head) head.setAttribute('aria-expanded', open ? 'true' : 'false');
  var panel = box.querySelector('.panel');
  if (panel) { if (open) panel.removeAttribute('inert'); else panel.setAttribute('inert', ''); }
}

/* ---- audio guide ---- */
function fmtTime(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
}
function wireAudio(back, cfg) {
  var box = back.querySelector('[data-audio]');
  var btn = box.querySelector('.play'), rng = box.querySelector('.a-range'),
      time = box.querySelector('.a-time'), sub = box.querySelector('.a-sub'),
      mute = box.querySelector('.a-mute');
  var src = cfg.back.audio && cfg.back.audio.src;
  if (!src) return null;

  var a = new Audio();
  a.preload = 'metadata';

  function setReady(on) {
    box.classList.toggle('is-ready', on);
    btn.disabled = !on; rng.disabled = !on; mute.disabled = !on;
    time.hidden = !on;
    var nm = cfg.audioLabel || cfg.title;
    sub.textContent = on ? nm : nm + ' · Coming soon';
  }
  function paint() {
    var d = a.duration, c = a.currentTime || 0;
    var pct = d > 0 ? (c / d) * 100 : 0;
    rng.value = d > 0 ? c : 0;
    rng.style.setProperty('--p', pct + '%');
    time.textContent = fmtTime(c) + ' / ' + fmtTime(d);
  }
  setReady(true);   // optimistic: enabled from the start; falls back to "Coming soon" only if the file errors

  a.addEventListener('durationchange', function () { if (isFinite(a.duration) && a.duration > 0) { rng.max = a.duration; paint(); } });
  a.addEventListener('loadedmetadata', function () {
    if (isFinite(a.duration) && a.duration > 0) { rng.max = a.duration; setReady(true); paint(); }
  });
  var triedBlob = false;
  a.addEventListener('error', function () {
    if (/^data:/.test(src) && !triedBlob) {      // some previews block data: media; retry as a blob URL
      triedBlob = true;
      try {
        var bin = atob(src.split(',')[1]), u8 = new Uint8Array(bin.length);
        for (var bi = 0; bi < bin.length; bi++) u8[bi] = bin.charCodeAt(bi);
        a.src = URL.createObjectURL(new Blob([u8], { type: 'audio/mpeg' }));
        return;
      } catch (e) { /* fall through */ }
    }
    if (/^data:/.test(src)) { sub.textContent = (cfg.audioLabel || cfg.title) + ' · Audio blocked in this preview, open the file in Chrome'; return; }
    setReady(false);
  });
  a.addEventListener('timeupdate', paint);
  a.addEventListener('play',  function () { box.classList.add('is-playing');    btn.setAttribute('aria-label', 'Pause audio guide'); });
  a.addEventListener('pause', function () { box.classList.remove('is-playing'); btn.setAttribute('aria-label', 'Play audio guide'); });
  a.addEventListener('ended', function () { a.currentTime = 0; paint(); });

  btn.addEventListener('click', function () {
    if (a.paused) { var p = a.play(); if (p && p.catch) p.catch(function () { /* playback blocked or failed */ }); if (a.error && !/^data:/.test(src)) setReady(false); }
    else a.pause();
  });
  rng.addEventListener('input', function () { a.currentTime = parseFloat(rng.value) || 0; paint(); });
  mute.addEventListener('click', function () {
    a.muted = !a.muted;
    box.classList.toggle('is-muted', a.muted);
    mute.setAttribute('aria-label', a.muted ? 'Unmute' : 'Mute');
  });

  a.src = src;
  return a;
}

function wireBack(back, cfg, key) {
  var acts = back.querySelectorAll('.act');
  acts.forEach(function (art) {
    art.querySelector('.act-head').addEventListener('click', function () {
      var willOpen = !art.classList.contains('open');
      acts.forEach(function (o) { if (o !== art && o.classList.contains('open')) setAcc(o, false); });   // one at a time
      setAcc(art, willOpen);
      if (willOpen) setTimeout(function () { art.scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' }); }, 340);
    });
  });
  var eat = back.querySelector('[data-eat]');
  if (eat) eat.querySelector('.eat-head').addEventListener('click', function () {
    var willOpen = !eat.classList.contains('open');
    setAcc(eat, willOpen);
    if (willOpen) setTimeout(function () { eat.scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' }); }, 340);
  });
  var vbtn = back.querySelector('[data-visit]');
  if (vbtn) vbtn.addEventListener('click', function () { setVisited(key, !VISITED[key]); });
  var why = back.querySelector('[data-why]');
  if (why) {
    var wb = why.querySelector('[data-why-btn]');
    wb.addEventListener('click', function () {
      var willOpen = !why.classList.contains('open');
      setAcc(why, willOpen);
      wb.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      if (willOpen) setTimeout(function () { why.scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' }); }, 340);
    });
  }
  var tlm = back.querySelector('[data-tl]');
  if (tlm) {
    [].forEach.call(tlm.querySelectorAll('[data-acc]'), function (item) {
      var hd = item.querySelector('.tl-head');
      hd.addEventListener('click', function () {
        var willOpen = !item.classList.contains('open');
        setAcc(item, willOpen);
        hd.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
        if (willOpen) setTimeout(function () { item.scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' }); }, 340);
      });
    });
    [].forEach.call(tlm.querySelectorAll('[data-go]'), function (b) {
      b.addEventListener('click', function () { goToStop(b.getAttribute('data-go')); });
    });
  }
  var rtm = back.querySelector('[data-route]');
  if (rtm) wireRoute(rtm);
  var pdf = back.querySelector('[data-pdf]');
  if (pdf) wirePdf(pdf);
  return back.querySelector('[data-audio]') ? wireAudio(back, cfg) : null;
}

/* ---- offline PDF button (same look as the itinerary page) ----
   Set PDF_URL to the real PDF (e.g. '/fuerteventura/rural-heart.pdf'). Until then the button stays disabled:
   nothing is faked. */
var PDF_URL = '';   /* no PDF file or URL exists yet: the sales page builds its PDF on the fly */
function wirePdf(box) {
  var btn = box.querySelector('[data-pdf-btn]'), info = box.querySelector('[data-pdf-info]'),
      tip = box.querySelector('[data-pdf-tip]'), st = box.querySelector('[data-pdf-status]');
  info.addEventListener('click', function () {
    var o = tip.hidden; tip.hidden = !o; info.setAttribute('aria-expanded', o ? 'true' : 'false');
  });
  if (!PDF_URL) { btn.disabled = true; btn.setAttribute('aria-disabled', 'true'); st.textContent = 'The offline PDF is not available yet.'; return; }
  btn.addEventListener('click', function () {
    var a = document.createElement('a');
    a.href = PDF_URL; a.download = 'The-Rural-Heart-of-Fuerteventura.pdf'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    st.textContent = 'Saved. You can open it any time, even without signal.';
  });
}

/* ---- miniature cards in the grid ---- */
document.querySelectorAll('.stop[data-stop]').forEach(function (el) {
  var cfg = STOPS[el.dataset.stop];
  if (!cfg) return;
  applyScope(el, cfg);
  el.appendChild(fragment(tplId(cfg, 'front'), cfg));
  el.querySelector('.front').setAttribute('aria-label', cfg.kind ? cfg.title + '. Tap to open.' : 'Stop ' + cfg.number + ', ' + cfg.title + '. Tap to open.');
  applyVisited(el, el.dataset.stop);
  el.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.front')) { e.preventDefault(); openStop(el); }
  });
});

/* =====================================================================
   Open / close: expand to full screen -> 3D flip -> read; close reverses.
   The overlay lives on <body>, outside the zoomable stage, so nothing
   from the grid's scale/translate is inherited.
   ===================================================================== */
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var EXPAND_MS = 480, FLIP_MS = 700;
var EASE_OUT = 'cubic-bezier(.22,.8,.25,1)', EASE_IO = 'cubic-bezier(.45,.1,.2,1)';

var ctx = null;          // the open stop {article, overlay, sheet, flip, backdrop, front, back, key}
var busy = false;        // an animation is running
var pendingClose = null; // 'pop' | 'btn' when the user asked to close mid-animation
var historyPushed = false; // true only if the browser allowed a history entry for the open card
var pendingOpen = null;   // key of the stop to open as soon as the current card has closed ("Go to stop")

function run(el, keyframes, ms, easing) {
  if (REDUCED) return Promise.resolve();
  var a = el.animate(keyframes, { duration: ms, easing: easing, fill: 'both' });
  return a.finished.then(function () { return a; }, function () { return a; });
}
function cancelAnims(el) { el.getAnimations().forEach(function (a) { a.cancel(); }); }

function rectFrame(r, radius) {
  return { top: r.top + 'px', left: r.left + 'px', width: r.width + 'px', height: r.height + 'px', borderRadius: radius + 'px' };
}
function fullFrame(overlay) {
  return { top: '0px', left: '0px', width: overlay.clientWidth + 'px', height: overlay.clientHeight + 'px', borderRadius: '0px' };
}

function setBackgroundInert(on) {
  var vp = document.getElementById('viewport');
  vp.inert = on;
  vp.style.pointerEvents = on ? 'none' : '';
}

function openStop(article) {
  if (busy || ctx) return;
  try { openStopInner(article); }
  catch (err) {
    if (window.console) console.error(err);
    if (ctx && ctx.overlay) ctx.overlay.remove();
    article.style.visibility = '';
    setBackgroundInert(false);
    ctx = null; busy = false; pendingClose = null; historyPushed = false;
  }
}

function openStopInner(article) {
  var key = article.dataset.stop, cfg = STOPS[key];
  if (!cfg) return;
  busy = true;
  pendingClose = null;

  var rect = article.getBoundingClientRect();
  var overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', cfg.title);
  overlay.innerHTML = '<div class="backdrop"></div><div class="sheet st-scope"><div class="flip"></div></div>';
  var backdrop = overlay.querySelector('.backdrop');
  var sheet = overlay.querySelector('.sheet');
  var flip = overlay.querySelector('.flip');
  applyScope(sheet, cfg);
  flip.appendChild(fragment(tplId(cfg, 'front'), cfg));
  flip.appendChild(fragment(tplId(cfg, 'back'), cfg));
  var front = flip.querySelector('.front'), back = flip.querySelector('.back');
  front.removeAttribute('data-open'); front.removeAttribute('tabindex'); front.removeAttribute('role');
  back.setAttribute('aria-label', cfg.title + ' details');
  back.querySelector('.bk-close').addEventListener('click', requestClose);

  ctx = { article: article, overlay: overlay, sheet: sheet, flip: flip, backdrop: backdrop, front: front, back: back, key: key, cfg: cfg };
  ctx.audio = wireBack(back, cfg, key);
  applyVisited(sheet, key);

  setBackgroundInert(true);
  historyPushed = false;
  try {
    history.pushState({ stop: key }, '', '#' + key);
    historyPushed = true;
  } catch (err) {
    try { history.pushState({ stop: key }, ''); historyPushed = true; } catch (err2) { /* no history in this context: the close button still works */ }
  }

  if (REDUCED) {
    document.body.appendChild(overlay);
    article.style.visibility = 'hidden';
    sheet.classList.add('settled');
    finishOpen();
    return;
  }

  // 1) the sheet starts exactly on top of the grid card, then the real card hides
  var radius = rect.width * 0.09;
  document.body.appendChild(overlay);
  var startFrame = rectFrame(rect, radius);
  sheet.animate([startFrame, startFrame], { duration: 1, fill: 'both' });   // hold the first frame until the expand starts
  article.style.visibility = 'hidden';

  // 2) expand to full screen, 3) flip to reveal the back
  cancelAnims(sheet);
  run(backdrop, [{ opacity: 0 }, { opacity: 1 }], EXPAND_MS, 'linear');
  run(sheet, [startFrame, fullFrame(overlay)], EXPAND_MS, EASE_OUT).then(function () {
    return run(flip, [{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(180deg)' }], FLIP_MS, EASE_IO);
  }).then(function () {
    cancelAnims(sheet); cancelAnims(flip); cancelAnims(backdrop);
    backdrop.style.opacity = '1';
    sheet.classList.add('settled');
    finishOpen();
  });
}

function finishOpen() {
  busy = false;
  if (ctx) ctx.back.querySelector('.bk-close').focus({ preventScroll: true });
  if (pendingClose) {
    var how = pendingClose; pendingClose = null;
    if (how === 'btn') requestClose(); else closeStop();
  }
}

function requestClose() {
  if (!ctx) return;
  if (busy) { pendingClose = 'btn'; return; }
  // go through history so the browser back button and the close button stay in sync
  if (historyPushed && history.state && history.state.stop) history.back(); else closeStop();
}

function closeStop() {
  if (!ctx || busy) return;
  busy = true;
  var c = ctx;
  if (c.audio) { try { c.audio.pause(); } catch (e) {} }

  if (REDUCED) { finishClose(c); return; }

  // reverse: un-settle, flip back to the front, shrink onto the grid card's current position
  c.sheet.classList.remove('settled');
  c.flip.classList.add('is-flipped');
  run(c.flip, [{ transform: 'rotateY(180deg)' }, { transform: 'rotateY(0deg)' }], FLIP_MS, EASE_IO).then(function () {
    cancelAnims(c.flip);
    c.flip.classList.remove('is-flipped');
    var rect = c.article.getBoundingClientRect();
    run(c.backdrop, [{ opacity: 1 }, { opacity: 0 }], EXPAND_MS, 'linear');
    return run(c.sheet, [fullFrame(c.overlay), rectFrame(rect, rect.width * 0.09)], EXPAND_MS, EASE_OUT);
  }).then(function () { finishClose(c); });
}

function finishClose(c) {
  c.overlay.remove();
  c.article.style.visibility = '';
  setBackgroundInert(false);
  ctx = null;
  busy = false;
  pendingClose = null;
  historyPushed = false;
  var f = c.article.querySelector('.front');
  if (f) f.focus({ preventScroll: true });
  if (pendingOpen) {
    var nk = pendingOpen; pendingOpen = null;
    setTimeout(function () { var a = document.querySelector('.stop[data-stop="' + nk + '"]'); if (a) openStop(a); }, 80);
  }
}

function goToStop(key) { pendingOpen = key; requestClose(); }

window.addEventListener('popstate', function () {
  if (!ctx) return;
  if (history.state && history.state.stop) return;   // forward into an open state: ignore
  if (busy) { pendingClose = 'pop'; return; }
  closeStop();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && ctx) requestClose();
});

/* ---------- Pinch-to-zoom + pan on the grid, with tap detection ---------- */
(function () {
  var viewport = document.getElementById('viewport');
  var stage = document.getElementById('stage');

  var MIN_SCALE = 1;   // 1 = whole overview visible
  var MAX_SCALE = 8;
  var TAP_MOVE = 10;   // px a finger may move and still count as a tap
  var TAP_TIME = 600;  // ms

  var scale = 1, tx = 0, ty = 0;
  var pointers = new Map();
  var start = null;
  var gesture = null;  // one per touch sequence: tells taps apart from pinches/drags

  function size() { return { w: viewport.clientWidth, h: viewport.clientHeight }; }

  function clamp() {
    var s = size();
    scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale));
    tx = Math.min(0, Math.max(s.w - s.w * scale, tx));
    ty = Math.min(0, Math.max(s.h - s.h * scale, ty));
  }

  function apply() {
    clamp();
    stage.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  }

  function snapshot() {
    var pts = Array.from(pointers.values());
    var cx, cy, dist = 0;
    if (pts.length >= 2) {
      cx = (pts[0].x + pts[1].x) / 2;
      cy = (pts[0].y + pts[1].y) / 2;
      dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    } else {
      cx = pts[0].x; cy = pts[0].y;
    }
    start = { cx: cx, cy: cy, dist: dist, scale: scale, tx: tx, ty: ty, count: pts.length };
  }

  function handleTap(target) {
    if (ctx || busy) return;
    var trigger = target.closest && target.closest('[data-open]');
    if (!trigger) return;
    var stop = trigger.closest('.stop');
    if (stop) openStop(stop);
  }

  viewport.addEventListener('pointerdown', function (e) {
    if (ctx) return;
    if (pointers.size === 0) {
      gesture = { target: e.target, x: e.clientX, y: e.clientY, moved: 0, multi: false, t0: Date.now() };
    } else if (gesture) {
      gesture.multi = true;           // a second finger: this is a pinch, never a tap
    }
    viewport.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    snapshot();
  });

  viewport.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gesture && !gesture.multi) {
      gesture.moved = Math.max(gesture.moved, Math.hypot(e.clientX - gesture.x, e.clientY - gesture.y));
    }
    if (!start) return;

    var pts = Array.from(pointers.values());
    if (pts.length >= 2 && start.count >= 2 && start.dist > 0) {
      var cx = (pts[0].x + pts[1].x) / 2;
      var cy = (pts[0].y + pts[1].y) / 2;
      var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      var newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, start.scale * dist / start.dist));
      var px = (start.cx - start.tx) / start.scale;
      var py = (start.cy - start.ty) / start.scale;
      scale = newScale;
      tx = cx - px * newScale;
      ty = cy - py * newScale;
    } else if (pts.length === 1 && start.count === 1) {
      tx = start.tx + (pts[0].x - start.cx);
      ty = start.ty + (pts[0].y - start.cy);
    }
    apply();
  });

  function end(e) {
    pointers.delete(e.pointerId);
    if (pointers.size > 0) { snapshot(); return; }
    start = null;
    var g = gesture;
    gesture = null;
    if (e.type === 'pointerup' && g && !g.multi && g.moved < TAP_MOVE && Date.now() - g.t0 < TAP_TIME) {
      handleTap(g.target);
    }
  }
  viewport.addEventListener('pointerup', end);
  viewport.addEventListener('pointercancel', end);

  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', apply);

  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) {
    document.addEventListener(n, function (e) { e.preventDefault(); });
  });

  apply();   // the stage keeps its zoom/pan while the overlay is open, so closing returns to the same view
})();
</script>
</body>
</html>
